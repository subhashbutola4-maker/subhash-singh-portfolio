function render(){
document.title=`${D.name} | ${D.designation}`;
const nm=edit?t("name","h1"):`<h1 aria-label="${esc(D.name)}">${D.name.split(" ").map(w=>`<span><i>${esc(w)}</i></span>`).join("")}</h1>`;
$("#app").className=(edit?"ed ":"")+(first?"":"noanim");first=false;
$("#app").innerHTML=`
<nav><a href="#top" class="nm">${esc(D.name)}</a><div class="ls">${D.nav.map((n,i)=>`<a href="${n.h}">${t(`nav.${i}.l`)}</a>`).join("")}</div></nav>
<header class="hero" id="top"><div class="glow"></div><div class="stage">
<div class="hola">${t("greeting")}<u>.</u></div>${nm}
<div class="role">${t("designation")}</div><p class="hl">${edit?t("headline"):hl(D.headline)}</p></div>
<div class="base"><div class="s"><b>${t("sub")}</b><span>${t("sub2")}</span></div>
<div class="tc"><span id="tc" aria-hidden="true">00:00:00:00</span><a class="pill pri" href="${esc(D.showreel)}" target="_blank" rel="noopener" data-cur="Play">${t("cta")}</a>${edit?`<span>URL: ${t("showreel")}</span>`:""}</div></div></header>
<section><div class="wrap"><p class="lede rv">${edit?t("intro"):esc(D.intro).replace(/(The instinct has not.*)$/,"<em>$1</em>")}</p></div></section>
<section id="work"><div class="wrap"><div class="head"><h2>${t("workTitle")}</h2><div class="fl" role="group" aria-label="Filter work">${tags().map(x=>`<button class="pill" data-f="${esc(x)}" aria-pressed="${x===flt}">${esc(x)}</button>`).join("")}</div></div>
<div class="grid">${D.projects.map(card).join("")}</div>${A("projects","Add project")}</div></section>
<section id="ai"><div class="wrap"><div class="lab rv">${t("aiTitle")}</div><h2 class="rv" style="margin:18px 0 0;max-width:16ch">${t("aiSub")}</h2>
<div class="steps rv">${D.steps.map((s,i)=>W("steps",i,`<small>0${i+1}</small><b>${t(`steps.${i}`)}</b>`,"div","step")).join("")}</div>${A("steps","Step")}
<div class="case rv"><p>${t("aiCase")}</p><ul class="lst">${strs("aiItems","li")}${A("aiItems","Item")}</ul></div>
<div class="meta9 rv">${D.socialMeta.map((_,i)=>W("socialMeta",i,t(`socialMeta.${i}`),"span")).join("")}${A("socialMeta","Tag")}</div>
<div class="case rv"><h2 style="font-size:clamp(32px,5vw,72px)">${t("socialTitle")}</h2><p>${t("socialText")}</p></div></div></section>
<section id="about"><div class="wrap duo"><div class="rv"><div class="lab">About</div><p class="lede" style="font-size:clamp(24px,3vw,40px);margin-top:18px">${t("about")}</p></div>
<div class="blk rv"><h3>Skills</h3><div class="chips">${strs("skills","span")}</div>${A("skills","Skill")}</div></div></section>
<section id="experience"><div class="wrap"><div class="head"><h2>${t("expTitle")}</h2></div>
${D.exp.map((e,i)=>W("exp",i,`<div class="y">${t(`exp.${i}.y`)}</div><div><h3>${t(`exp.${i}.org`)}</h3><div class="r">${t(`exp.${i}.role`)}</div><p>${t(`exp.${i}.d`)}</p></div>`,"div","exp rv")).join("")}${A("exp","Experience")}
<div class="aw" style="margin-top:48px">${D.awards.map((a,i)=>W("awards",i,`<b>${t(`awards.${i}.t`)}</b><span>${t(`awards.${i}.d`)}</span>`,"div","award rv")).join("")}</div>${A("awards","Award")}
<div class="lab" style="margin:64px 0 16px">Brands</div><div class="mq"><div>${(edit?D.clients:[...D.clients,...D.clients]).map((c,i)=>edit?W("clients",i,t(`clients.${i}`),"span"):`<span>${esc(c)}</span>`).join("")}</div></div>${A("clients","Brand")}</div></section>
<section id="contact"><div class="wrap"><div class="head"><h2>${t("contactTitle")}</h2></div>
<a class="big" href="mailto:${esc(D.email)}" data-cur="Open">${t("email")}</a>
<div class="ln">${D.links.map((l,i)=>W("links",i,`<a class="pill" href="${esc(l.u)}" target="_blank" rel="noopener">${t(`links.${i}.l`)}</a>${edit?`<small>${t(`links.${i}.u`)}</small>`:""}`,"span","").replace('<span class=""','<span style="position:relative;display:inline-flex;gap:8px;align-items:center"')).join("")}${A("links","Link")}</div></div></section>
<footer><span>${t("footer")}</span>${edit?"":`<button data-a="edit">Edit</button>`}</footer>
${edit?`<div id="bar"><button class="pill pri" data-a="save">Save</button><button class="pill" data-a="cancel">Cancel</button><button class="pill" data-a="export">Export</button><button class="pill" data-a="import">Import</button></div>`:""}`;
io();}
const io0=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");io0.unobserve(e.target)}}),{threshold:.08});
const io=()=>document.querySelectorAll(".rv").forEach(e=>io0.observe(e));
/* ---- modal helpers ---- */
const openM=h=>{$("#m").innerHTML=`<div class="mb"><button class="x" data-a="close" aria-label="Close">×</button>${h}</div>`;$("#m").classList.add("on")},closeM=()=>$("#m").classList.remove("on");
const ask=msg=>new Promise(r=>{openM(`<h3>Delete?</h3><p>${esc(msg)}</p><button class="pill" data-a="no">Cancel</button> <button class="pill pri" data-a="yes">Delete</button>`);window._r=r});
function showP(i){const p=D.projects[i],e=emb(p),r=(p.ratio||"16:9").replace(":","/"),L=[["Vimeo",p.vimeo],["YouTube",p.youtube],["Behance",p.behance],["Link",p.url]].filter(x=>x[1]);
const fb=D.links.find(l=>l.l==="Vimeo");
openM(`<div class="tg" style="margin-bottom:10px">${(p.tags||[]).map(x=>`<i>${esc(x)}</i>`).join("")}</div><h3>${esc(p.title)}</h3><p>${esc([p.sub,p.client,p.year].filter(Boolean).join(" · "))}</p>
${e?`<div class="vid" style="aspect-ratio:${r}"><iframe src="${e}" allow="autoplay;fullscreen;picture-in-picture" allowfullscreen title="${esc(p.title)}"></iframe></div>`:p.hero||p.thumb?`<div class="vid" style="aspect-ratio:${r}"><img src="${p.hero||p.thumb}" alt=""></div>`:""}
${p.desc?`<p>${esc(p.desc)}</p>`:""}<div class="gal">${(p.gallery||[]).map(g=>`<img src="${g}" alt="">`).join("")}</div>
<div class="ln" style="margin-top:12px">${L.map(x=>`<a class="pill" href="${esc(x[1])}" target="_blank" rel="noopener">${x[0]} ↗</a>`).join("")}${!L.length&&fb?`<a class="pill" href="${esc(fb.u)}" target="_blank" rel="noopener">More on Vimeo ↗</a>`:""}</div>`)}
let tmp;
function form(i){const n=i<0;tmp=n?{id:"p"+Date.now(),tags:[],gallery:[],ratio:"16:9"}:structuredClone(D.projects[i]);tmp.gallery||=[];tmp._i=i;
const f=(k,l,w)=>`<label class="${w||""}">${l}<input data-k="${k}" value="${esc(tmp[k]||"")}"></label>`;
openM(`<h3>${n?"Add":"Edit"} project</h3><div class="fg">${f("title","Title")}${f("sub","Subtitle")}${f("client","Client / brand")}${f("year","Year")}
<label class="w">Tags (comma separated)<input data-k="tags" value="${esc((tmp.tags||[]).join(", "))}"></label>
<label>Aspect ratio<select data-k="ratio">${["16:9","9:16","4:5","1:1"].map(r=>`<option${r===tmp.ratio?" selected":""}>${r}</option>`).join("")}</select></label>
<label>Options<span><input type="checkbox" data-k="featured"${tmp.featured?" checked":""} style="width:auto"> Featured &nbsp; <input type="checkbox" data-k="ai"${tmp.ai?" checked":""} style="width:auto"> AI project</span></label>
<label class="w">Description<textarea data-k="desc">${esc(tmp.desc||"")}</textarea></label>${f("vimeo","Vimeo URL")}${f("youtube","YouTube URL")}${f("behance","Behance URL")}${f("url","External / video URL")}
<div class="w" id="imgs"></div></div>
<button class="pill pri" data-a="psave">Save project</button> ${n?"":`<button class="pill" data-a="pdel">Delete</button>`} <button class="pill" data-a="close">Cancel</button>`);imgs()}
function imgs(){$("#imgs").innerHTML=["thumb","hero"].map(k=>`<div class="lab" style="margin:10px 0 6px">${k==="thumb"?"Thumbnail":"Hero image"}</div><div class="im">${tmp[k]?`<img src="${tmp[k]}" alt=""><button class="pill" data-a="rm" data-k="${k}">Remove</button>`:""}<input type="file" accept="image/*" data-img="${k}"></div>`).join("")+`<div class="lab" style="margin:10px 0 6px">Gallery</div><div class="im">${tmp.gallery.map((g,j)=>`<span><img src="${g}" alt=""><button class="pill" data-a="rm" data-k="gallery" data-j="${j}">×</button></span>`).join("")}<input type="file" accept="image/*" multiple data-img="gallery"></div>`}
const shrink=f=>new Promise(r=>{const fr=new FileReader;fr.onload=()=>{const i=new Image;i.onload=()=>{const s=Math.min(1,1400/Math.max(i.width,i.height)),c=document.createElement("canvas");c.width=i.width*s;c.height=i.height*s;c.getContext("2d").drawImage(i,0,0,c.width,c.height);r(c.toDataURL("image/jpeg",.8))};i.src=fr.result};fr.readAsDataURL(f)});
document.addEventListener("change",async e=>{const k=e.target.dataset.img;if(!k)return;for(const f of e.target.files){const d=await shrink(f);k==="gallery"?tmp.gallery.push(d):tmp[k]=d}imgs()});
document.addEventListener("input",e=>{const p=e.target.dataset?.p;if(p)set(p,e.target.textContent)});
/* ---- drag reorder (via handle) ---- */
let dr;document.addEventListener("pointerdown",e=>{const h=e.target.closest(".hd");if(h)h.closest("[data-l]").draggable=true});
document.addEventListener("dragstart",e=>{const h=e.target.closest?.("[data-l]");if(h)dr=h;else e.preventDefault()});
document.addEventListener("dragend",()=>document.querySelectorAll("[data-l]").forEach(x=>x.draggable=false));
document.addEventListener("dragover",e=>{const h=e.target.closest("[data-l]");if(dr&&h&&h.dataset.l===dr.dataset.l)e.preventDefault()});
document.addEventListener("drop",e=>{const h=e.target.closest("[data-l]");if(!dr||!h||h.dataset.l!==dr.dataset.l)return;e.preventDefault();const a=get(h.dataset.l),[x]=a.splice(+dr.dataset.i,1);a.splice(+h.dataset.i,0,x);dr=null;render()});
document.addEventListener("click",async e=>{
const b=e.target.closest("[data-a],[data-add],[data-open],[data-f],a");if(!b)return;
if(b.tagName==="A"&&edit&&!e.target.closest("#m")){e.preventDefault();return}
if(b.dataset.f!==undefined){flt=b.dataset.f;render();return}
if(b.dataset.add){b.dataset.add==="projects"?form(-1):(get(b.dataset.add).push(structuredClone(ADD[b.dataset.add])),render());return}
const a=b.dataset.a,h=b.closest("[data-l]");
if(a==="up"||a==="del"){const arr=get(h.dataset.l),i=+h.dataset.i;if(a==="up"&&i>0){[arr[i-1],arr[i]]=[arr[i],arr[i-1]];render()}
if(a==="del"&&await ask("This cannot be undone until you press Cancel. Delete this item?")){arr.splice(i,1);closeM();render()}else if(a==="del")closeM();return}
if(b.dataset.open!==undefined){edit?form(+b.dataset.open):showP(+b.dataset.open);return}
if(a==="close")closeM();
if(a==="yes"){window._r(true)}if(a==="no"){window._r(false)}
if(a==="edit"){edit=true;render()}
if(a==="cancel"){D=load();edit=false;render()}
if(a==="save"){try{localStorage.setItem(KEY,JSON.stringify(D));edit=false;render()}catch(x){openM("<h3>Not saved</h3><p>Browser storage is full or blocked. Remove large images, or use Export to keep a copy.</p>")}}
if(a==="export")openM(`<h3>Export</h3><p>Copy this JSON. It is the full content of the site.</p><textarea readonly>${esc(JSON.stringify(D,null,1))}</textarea>`);
if(a==="import"){openM(`<h3>Import</h3><p>Paste exported JSON, then apply. Press Save afterwards to keep it.</p><textarea id="imp"></textarea><br><button class="pill pri" data-a="apply">Apply</button>`)}
if(a==="apply"){try{D={...structuredClone(DEFAULT),...JSON.parse($("#imp").value)};closeM();render()}catch(x){alert("Invalid JSON")}}
if(a==="rm"){b.dataset.k==="gallery"?tmp.gallery.splice(+b.dataset.j,1):tmp[b.dataset.k]="";imgs()}
if(a==="psave"){const m=$("#m");m.querySelectorAll("[data-k]").forEach(x=>{if(!x.closest("#imgs")&&x.dataset.k){const k=x.dataset.k;tmp[k]=x.type==="checkbox"?x.checked:k==="tags"?x.value.split(",").map(s=>s.trim().toUpperCase()).filter(Boolean):x.value.trim()}});
if(!tmp.title){alert("Title is required");return}const i=tmp._i;delete tmp._i;i<0?D.projects.push(tmp):D.projects[i]=tmp;closeM();render()}
if(a==="pdel"){const i=tmp._i;if(await ask(`Delete "${D.projects[i].title}"?`)){D.projects.splice(i,1);closeM();render()}else form(i)}
});
addEventListener("keydown",e=>{if(e.key==="Escape")closeM()});
/* ---- cursor, parallax, timecode ---- */
const cu=$("#cu");addEventListener("mousemove",e=>{cu.style.transform=`translate(${e.clientX}px,${e.clientY}px)`;const c=e.target.closest?.("[data-cur]");cu.dataset.s=c?"1":"";cu.textContent=c?c.dataset.cur:""});
addEventListener("scroll",()=>{const g=$(".glow");if(g)g.style.marginTop=Math.min(scrollY,900)*.2+"px"},{passive:true});
const p2=n=>String(n).padStart(2,"0");let fr=0;
if(!matchMedia("(prefers-reduced-motion:reduce)").matches)setInterval(()=>{fr++;const e=$("#tc");if(e)e.textContent=`${p2(Math.floor(fr/86400)%100)}:${p2(Math.floor(fr/3600)%60)}:${p2(Math.floor(fr/24)%60)}:${p2(fr%24)}`},41);
render();
</script></body></html>
